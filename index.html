function loginPage(){return `<div class="login"><div class="login-card"><div class="brand"><div class="avatar" style="width:70px;height:70px;font-size:34px">🏫</div><div><h1>ระบบแจ้งปัญหาภายในโรงเรียน</h1><p>School Problem Reporting</p></div></div><h2>เข้าสู่ระบบ</h2><p class="hint">เลือกประเภทผู้ใช้งานเพื่อเริ่มสาธิตระบบ</p><div class="roles"><button class="role active" id="lr-reporter" type="button" onclick="selectLoginRole('reporter')">👨‍🎓 ผู้แจ้ง<small>Reporter</small></button><button class="role" id="lr-technician" type="button" onclick="selectLoginRole('technician')">🔧 ช่าง<small>Technician</small></button><button class="role" id="lr-admin" type="button" onclick="selectLoginRole('admin')">👨‍💼 Admin<small>Administrator</small></button></div><form onsubmit="doLogin(event)"><div class="field"><label>ชื่อผู้ใช้ / รหัสนักเรียน</label><input name="username" required placeholder="กรอกชื่อผู้ใช้งาน"></div><div class="field"><label>รหัสผ่าน</label><input type="password" name="password" required placeholder="กรอกรหัสผ่าน"></div><button class="btn primary full" type="submit">เข้าสู่ระบบ →</button></form><p class="hint" style="text-align:center;margin-top:15px">Prototype สำหรับนำเสนอ • เริ่มต้นข้อมูลเป็นศูนย์</p></div></div>`}
function selectLoginRole(r){state.role=r;document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));document.getElementById('lr-'+r)?.classList.add('active')}
function doLogin(e){e.preventDefault();localStorage.setItem('sri_role',state.role);localStorage.setItem('sri_logged_in','1');state.loggedIn=true;state.page='dashboard';render();toast('เข้าสู่ระบบสำเร็จ • '+ROLES[state.role])}
function logout(){localStorage.removeItem('sri_logged_in');state.loggedIn=false;state.page='dashboard';render()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cname(k){return (C.find(x=>x[0]===k)||['','อื่น ๆ','•••'])[1]}function cicon(k){return (C.find(x=>x[0]===k)||['','','•••'])[2]}
function badge(s){let x=ST[s]||ST.wait;return `<span class="badge ${x[1]}">${x[0]}</span>`}function urgency(u){return u==='urgent'?'<span class="badge urgent">🔴 เร่งด่วน</span>':u==='high'?'<span class="badge urgent">🟠 เร่งด่วนมาก</span>':'<span class="badge wait">🟢 ปกติ</span>'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),2600)}
function nav(p){state.page=p;render();window.scrollTo({top:0})}function role(r){state.role=r;localStorage.setItem('sri_role',r);state.page='dashboard';render();toast('เข้าสู่โหมด '+ROLES[r])}
function toggle(){document.querySelector('.side')?.classList.toggle('open')}
function visible(r){return state.role==='admin'||(state.role==='technician'?!!r.technician:true)}
function rows(){let q=state.search.toLowerCase().trim();return state.reports.filter(r=>visible(r)&&(!q||[r.id,r.title,r.location,r.room,r.detail].join(' ').toLowerCase().includes(q))&&(state.fs==='all'||r.status===state.fs)&&(state.fc==='all'||r.category===state.fc))}
function layout(body){let items=state.role==='reporter'?[['dashboard','🏠','หน้าหลัก'],['report','⊕','แจ้งปัญหา'],['my','▤','ปัญหาของฉัน'],['notifications','🔔','แจ้งเตือน'],['profile','◯','โปรไฟล์']]:state.role==='technician'?[['dashboard','🏠','Dashboard'],['jobs','🔧','งานที่ได้รับมอบหมาย'],['history','▤','ประวัติงาน'],['notifications','🔔','แจ้งเตือน'],['profile','◯','โปรไฟล์']]:[['dashboard','🏠','Dashboard'],['manage','▤','จัดการปัญหา'],['reports','📊','รายงานและสถิติ'],['settings','⚙','ตั้งค่าระบบ'],['notifications','🔔','แจ้งเตือน'],['profile','◯','โปรไฟล์']];return `<div class="shell"><aside class="side"><div class="side-brand"><img src="${LOGO}" alt="ตราโรงเรียนศรียาภัย"><strong>ศรียาภัย</strong><span>Sriyapai · School Problem Reporting</span></div><nav class="nav">${items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}${x[0]==='notifications'&&state.noti?`<span class="badge urgent" style="margin-left:auto">${state.noti}</span>`:''}</button>`).join('')}</nav><div style="margin-top:30px"><button class="btn ghost full" onclick="logout()">↪ ออกจากระบบ</button></div></aside><main><header class="top"><button class="mobile" onclick="toggle()">☰</button><div class="search"><span>⌕</span><input placeholder="ค้นหาปัญหา, Report ID, หรือสถานที่..." value="${esc(state.search)}" oninput="state.search=this.value;refresh()"></div><button class="btn ghost" onclick="nav('notifications')">🔔 ${state.noti||''}</button><div class="profile"><div class="avatar">👤</div><div><strong>${ROLES[state.role]}</strong><small>Prototype Mode</small></div></div></header><section class="content">${body}<div class="footer">Sriyapai School • ระบบแจ้งปัญหาภายในโรงเรียน • Prototype v1.0 • ข้อมูลตัวอย่างเก็บในเบราว์เซอร์นี้</div></section></main></div>`}
function dashboard(){let rs=state.reports.filter(visible),cnt={all:rs.length,wait:0,received:0,work:0,fixed:0,closed:0};rs.forEach(r=>cnt[r.status]++);return `<div class="hero"><div><h2>${state.role==='admin'?'ภาพรวมระบบ 📊':state.role==='technician'?'ศูนย์งานช่าง 🔧':'สวัสดีตอนนี้ 👋'}</h2><p>${state.role==='admin'?'จัดการและติดตามปัญหาภายในโรงเรียนศรียาภัย':state.role==='technician'?'จัดการงานที่ได้รับมอบหมายและบันทึกผลการซ่อม':'ติดตามปัญหาภายในโรงเรียนศรียาภัยได้จากที่นี่'}</p></div><div class="art"></div></div><div class="stats">${[['all','📄','ทั้งหมด','yellow'],['wait','🕒','รอรับเรื่อง','red'],['work','🔧','กำลังดำเนินการ','blue'],['fixed','✓','แก้ไขแล้ว','green'],['closed','🛡','ปิดงาน','purple']].map(x=>`<div class="stat"><div class="stat-icon ${x[3]}">${x[1]}</div><div class="num">${cnt[x[0]]}</div><div class="label">${x[2]}</div></div>`).join('')}</div><div class="grid"><div>${state.role==='reporter'?`<div class="card cta"><div><h3>แจ้งปัญหาใหม่</h3><p>พบปัญหาภายในโรงเรียน? แจ้งรายละเอียดและตำแหน่งให้ช่างแก้ไขได้รวดเร็วยิ่งขึ้น</p><button class="btn primary" onclick="nav('report')">＋ แจ้งปัญหาใหม่ →</button></div></div>`:''}<div class="card"><div class="title"><h3>สถิติการแจ้งปัญหา</h3><span class="muted">7 วันล่าสุด</span></div>${chart()}</div></div><div><div class="card" style="margin-bottom:17px"><div class="title"><h3>รายการล่าสุด</h3><button class="btn ghost" onclick="nav('${state.role==='reporter'?'my':state.role==='technician'?'jobs':'manage'}')">ดูทั้งหมด →</button></div><div class="issues">${rs.slice(0,4).map(issue).join('')||'<div class="muted">ยังไม่มีรายการ</div>'}</div></div><div class="card"><div class="title"><h3>หมวดหมู่ปัญหาที่พบบ่อย</h3></div>${cats(rs)}</div></div></div>`}
function issue(r){return `<div class="issue" onclick="detail('${r.id}')"><div class="thumb">${cicon(r.category)}</div><div><h4>#${esc(r.id)} · ${esc(r.title)}</h4><p>📍 ${esc(r.location)}${r.room?' • '+esc(r.room):''}</p><small>${esc(r.created)}</small></div>${badge(r.status)}</div>`}
function cats(rs){let a=C.map(c=>({...c,n:rs.filter(r=>r.category===c[0]).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,5),m=Math.max(1,...a.map(x=>x.n));return `<div class="cats">${a.map(c=>`<div class="cat"><div>${c[2]}</div><div><b>${c[1]}</b><i><b style="width:${c.n/m*100}%"></b></i></div><b>${c.n}</b></div>`).join('')||'ยังไม่มีข้อมูล'}</div>`}
function chart(){let v=[8,10,12,9,13,15,10];return `<div class="chart">${v.map((n,i)=>`<div class="barbox"><div class="bar" style="height:${n/15*85}%"></div><small>${4+i} ก.ย.</small></div>`).join('')}</div>`}
function form(){return `<div class="pagehead"><div><h2>แจ้งปัญหาใหม่</h2><p>กรอกข้อมูลให้ครบถ้วนเพื่อให้ช่างดำเนินการได้รวดเร็ว</p></div></div><form class="card" onsubmit="submitReport(event)"><div class="formgrid"><div class="field"><label>หัวข้อปัญหา *</label><input name="title" required maxlength="100" placeholder="เช่น หลอดไฟเสีย"></div><div class="field"><label>ประเภทปัญหา *</label><select name="category" required>${C.map(c=>`<option value="${c[0]}">${c[2]} ${c[1]}</option>`).join('')}</select></div><div class="field"><label>อาคาร/สถานที่ *</label><select name="location" required>${LOC.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>ห้อง/พื้นที่</label><input name="room" maxlength="80" placeholder="เช่น ห้อง 302"></div><div class="field span"><label>ตำแหน่งเพิ่มเติม</label><input name="extra" maxlength="150" placeholder="เช่น หน้าห้องเรียน ชั้น 2"></div><div class="field span"><label>รายละเอียดปัญหา *</label><textarea name="detail" required maxlength="1000" placeholder="อธิบายอาการหรือปัญหาที่พบ"></textarea></div><div class="field"><label>ความเร่งด่วน *</label><select name="urgency"><option value="normal">🟢 ปกติ</option><option value="urgent">🔴 เร่งด่วน</option><option value="high">🟠 เร่งด่วนมาก</option></select></div><div class="field"><label>รูปภาพปัญหา</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">JPG, PNG, WebP ไม่เกิน 2 MB</small></div></div><div class="actions"><button type="button" class="btn ghost" onclick="nav('dashboard')">ยกเลิก</button><button class="btn primary">✓ ส่งเรื่อง</button></div></form>`}
function submitReport(e){e.preventDefault();let f=e.target,fd=new FormData(f),file=f.image.files[0];if(file&&(file.size>2*1024*1024||!/^image\/(jpeg|png|webp)$/.test(file.type))){toast('รูปภาพต้องเป็น JPG/PNG/WebP และไม่เกิน 2 MB');return}let r={id:'RP'+String(Math.max(0,...state.reports.map(x=>+x.id.replace('RP','')||0))+1).padStart(3,'0'),title:fd.get('title').trim(),category:fd.get('category'),location:fd.get('location'),room:fd.get('room').trim(),extra:fd.get('extra').trim(),detail:fd.get('detail').trim(),urgency:fd.get('urgency'),reporter:'นักเรียน',status:'wait',technician:'',created:new Intl.DateTimeFormat('th-TH',{dateStyle:'short',timeStyle:'short'}).format(new Date())};let finish=()=>{state.reports.unshift(r);save();state.noti++;nav('my');toast('ส่งเรื่องสำเร็จ • '+r.id)};if(file){let rd=new FileReader();rd.onload=()=>{r.image=rd.result;finish()};rd.readAsDataURL(file)}else finish()}
function listPage(){let rs=rows();return `<div class="pagehead"><div><h2>${state.role==='admin'?'จัดการปัญหา':state.role==='technician'?'งานที่ได้รับมอบหมาย':'ปัญหาของฉัน'}</h2><p>${state.role==='admin'?'รับเรื่อง มอบหมายช่าง ติดตาม และปิดงาน':state.role==='technician'?'ดูเฉพาะงานที่ได้รับมอบหมาย':'ติดตามสถานะรายการที่แจ้ง'}</p></div>${state.role==='reporter'?`<button class="btn primary" onclick="nav('report')">＋ แจ้งปัญหา</button>`:''}</div><div class="card"><div class="filters"><input id="ls" placeholder="ค้นหา Report ID / หัวข้อ / สถานที่" value="${esc(state.search)}" oninput="state.search=this.value;refresh()"><select onchange="state.fs=this.value;refresh()"><option value="all">ทุกสถานะ</option>${Object.keys(ST).map(k=>`<option value="${k}" ${state.fs===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select><select onchange="state.fc=this.value;refresh()"><option value="all">ทุกประเภท</option>${C.map(c=>`<option value="${c[0]}" ${state.fc===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div id="list">${table(rs)}</div></div>`}
function table(rs){if(!rs.length)return '<div style="padding:40px;text-align:center" class="muted">ไม่พบรายการ</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Report ID</th><th>ปัญหา</th><th>สถานที่</th><th>เร่งด่วน</th><th>สถานะ</th><th>ช่าง</th></tr></thead><tbody>${rs.map(r=>`<tr class="row" onclick="detail('${r.id}')"><td><b>#${r.id}</b><br><small>${r.created}</small></td><td>${cicon(r.category)} ${esc(r.title)}<br><small>${cname(r.category)}</small></td><td>${esc(r.location)}${r.room?' • '+esc(r.room):''}</td><td>${urgency(r.urgency)}</td><td>${badge(r.status)}</td><td>${esc(r.technician||'ยังไม่มอบหมาย')}</td></tr>`).join('')}</tbody></table></div>`}
function refresh(){let el=document.getElementById('list');if(el)el.innerHTML=table(rows())}
function detail(id){let r=state.reports.find(x=>x.id===id);if(!r)return;let action='';if(state.role==='admin'){if(r.status==='wait')action=`<button class="btn primary full" onclick="receive('${id}')">✓ รับเรื่อง</button>`;else if(r.status==='received')action=`<div class="field"><label>เลือกช่าง</label><select id="tech"><option>ช่างไฟฟ้า</option><option>ช่างประปา</option><option>ช่างแอร์</option><option>ช่างอาคาร</option><option>ช่างทั่วไป</option></select></div><button class="btn primary full" onclick="assign('${id}')">🔧 มอบหมายช่าง</button>`;else if(r.status==='fixed')action=`<button class="btn danger" onclick="sendback('${id}')">↩ ส่งกลับแก้ไข</button> <button class="btn primary" onclick="closeJob('${id}')">✓ ปิดงาน</button>`}else if(state.role==='technician'&&r.technician){if(r.status==='received')action=`<button class="btn primary full" onclick="startJob('${id}')">▶ รับงานและเริ่มดำเนินการ</button>`;else if(r.status==='work')action=`<div class="field"><label>รายละเอียดการซ่อม *</label><textarea id="repair" placeholder="ระบุสิ่งที่ตรวจสอบและดำเนินการ"></textarea></div><div class="field"><label>รูปภาพหลังซ่อม</label><input id="after" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn primary full" onclick="fixJob('${id}')">✓ บันทึกและแจ้งว่าแก้ไขแล้ว</button>`}else action='<p class="muted">สถานะจะเปลี่ยนโดย Admin และช่างตามขั้นตอนของระบบ</p>';document.getElementById('modal').innerHTML=`<div class="modalbg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><h3>#${r.id} · ${esc(r.title)}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="detail"><div><div class="kv"><b>ประเภท</b><span>${cicon(r.category)} ${cname(r.category)}</span></div><div class="kv"><b>สถานที่</b><span>📍 ${esc(r.location)}${r.room?' • '+esc(r.room):''}</span></div><div class="kv"><b>ตำแหน่งเพิ่มเติม</b><span>${esc(r.extra||'-')}</span></div><div class="kv"><b>ความเร่งด่วน</b><span>${urgency(r.urgency)}</span></div><div class="kv"><b>ผู้แจ้ง</b><span>${esc(r.reporter)}</span></div><div class="kv"><b>ช่าง</b><span>${esc(r.technician||'ยังไม่มอบหมาย')}</span></div><div class="kv"><b>รายละเอียด</b><span>${esc(r.detail)}</span></div>${r.image?`<div class="field"><label>รูปภาพปัญหา</label><img src="${r.image}" style="max-height:220px;border-radius:12px;border:1px solid var(--line)"></div>`:''}</div><div><div class="title"><h3>Timeline</h3>${badge(r.status)}</div><div class="timeline">${Object.keys(ST).map((s,i)=>`<div class="tl ${Object.keys(ST).indexOf(r.status)>=i?'done':''}"><h4>${Object.keys(ST).indexOf(r.status)>=i?'✓':'○'} ${ST[s][0]}</h4><p>${i===0?r.created:Object.keys(ST).indexOf(r.status)>=i?'ดำเนินการแล้ว':'รอดำเนินการ'}</p></div>`).join('')}</div><div style="margin-top:20px">${action}</div></div></div></div></div>`}
function closeModal(e){if(!e||e.target===e.currentTarget)document.getElementById('modal').innerHTML=''}
function change(id,s,extra={}){let r=state.reports.find(x=>x.id===id);if(!r)return;r.status=s;Object.assign(r,extra);save();closeModal();render();toast('#'+id+' → '+ST[s][0])}
function receive(id){if(state.role==='admin')change(id,'received')}function assign(id){let t=document.getElementById('tech').value;change(id,'received',{technician:t});state.noti++;toast('มอบหมาย '+t+' ให้ #'+id+' แล้ว')}
function startJob(id){if(state.role==='technician')change(id,'work')}function fixJob(id){let note=document.getElementById('repair')?.value.trim(),f=document.getElementById('after')?.files[0];if(!note){toast('กรุณาระบุรายละเอียดการซ่อม');return}if(f&&f.size>2*1024*1024){toast('รูปภาพหลังซ่อมต้องไม่เกิน 2 MB');return}let done=img=>change(id,'fixed',{repairNote:note,afterImage:img||''});if(f){let rd=new FileReader();rd.onload=()=>done(rd.result);rd.readAsDataURL(f)}else done('')}
function sendback(id){change(id,'work',{adminNote:'Admin ขอให้ตรวจสอบ/แก้ไขเพิ่มเติม'})}function closeJob(id){change(id,'closed',{adminNote:'Admin ตรวจสอบผลการแก้ไขแล้ว'})}
function stats(){let r=state.reports;return `<div class="pagehead"><div><h2>รายงานและสถิติ</h2><p>ภาพรวมการแจ้งปัญหาของโรงเรียน</p></div></div><div class="stats">${[['ทั้งหมด',r.length,'yellow'],['กำลังดำเนินการ',r.filter(x=>x.status==='work').length,'blue'],['แก้ไขแล้ว',r.filter(x=>x.status==='fixed').length,'green'],['ปิดงาน',r.filter(x=>x.status==='closed').length,'purple'],['เร่งด่วน',r.filter(x=>x.urgency!=='normal').length,'red']].map(x=>`<div class="stat"><div class="stat-icon ${x[2]}">●</div><div class="num">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div><div class="grid"><div class="card"><div class="title"><h3>หมวดหมู่ปัญหา</h3></div>${cats(r)}</div><div class="card"><div class="title"><h3>สถานะงาน</h3></div>${Object.keys(ST).map(k=>`<div class="kv"><b>${ST[k][0]}</b><span>${r.filter(x=>x.status===k).length} รายการ</span></div>`).join('')}</div></div>`}
function notifications(){return `<div class="pagehead"><div><h2>แจ้งเตือน</h2><p>สถานะและงานที่เกี่ยวข้อง</p></div><button class="btn ghost" onclick="state.noti=0;render()">ทำเครื่องหมายว่าอ่านแล้ว</button></div><div class="card"><div class="issues">${state.reports.slice(0,6).map(issue).join('')}</div></div>`}
function settings(){return `<div class="pagehead"><div><h2>ตั้งค่าระบบ</h2><p>ข้อมูลพื้นฐานของ Prototype</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>ชื่อระบบ</label><input readonly value="Sriyapai — School Problem Reporting"></div><div class="field"><label>โรงเรียน</label><input readonly value="โรงเรียนศรียาภัย"></div><div class="field"><label>สถานที่</label><input readonly value="อาคาร 1 – อาคาร 11 และพื้นที่ส่วนกลาง"></div><div class="field"><label>การจัดเก็บ</label><input readonly value="Local Storage ของเบราว์เซอร์"></div></div><button class="btn danger" onclick="resetDemo()">↺ รีเซ็ตข้อมูลตัวอย่าง</button></div>`}
function profile(){return `<div class="pagehead"><div><h2>โปรไฟล์</h2><p>ข้อมูลผู้ใช้งาน Prototype</p></div></div><div class="card"><div class="brand"><div class="avatar" style="width:65px;height:65px">👤</div><div><h2 style="margin:0">${ROLES[state.role]}</h2><p>Sriyapai School Problem Reporting</p></div></div><div class="actions" style="justify-content:flex-start"><button class="btn secondary" onclick="role(state.role==='reporter'?'technician':state.role==='technician'?'admin':'reporter')">เปลี่ยนบทบาทสำหรับทดสอบ</button></div></div>`}
function resetDemo(){if(confirm('รีเซ็ตข้อมูลทั้งหมดและกลับไปหน้าเข้าสู่ระบบหรือไม่?')){localStorage.removeItem('sri_reports');localStorage.removeItem('sri_role');localStorage.removeItem('sri_logged_in');state.reports=[];state.noti=0;state.loggedIn=false;state.role='reporter';state.page='dashboard';render();toast('รีเซ็ตข้อมูลทั้งหมดแล้ว')}}
function render(){if(!state.loggedIn){document.getElementById('root').innerHTML=loginPage();return}let b=state.page==='dashboard'?dashboard():state.page==='report'?form():(state.page==='my'||state.page==='manage'||state.page==='jobs'||state.page==='history')?listPage():state.page==='reports'?stats():state.page==='settings'?settings():state.page==='notifications'?notifications():profile();document.getElementById('root').innerHTML=layout(b)}render();
</script></body></html>
